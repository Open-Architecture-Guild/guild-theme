{% assign n = site.data.notice %}
{% if n.enabled %}
<div class="notice" role="note">
<div class="container">
<span class="notice-tag">{{ n.tag }}</span>
<span>{{ n.text }}</span>
{% if n.link_url %}
<a href="{% if n.link_url contains ':' %}{{ n.link_url }}{% else %}{{ n.link_url | relative_url }}{% endif %}">{{ n.link_title }}</a>
{% endif %}
</div>
</div>
{% endif %}
